<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Of Computer Science</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="brand">VOCS Unklab</div>
        <nav class="site-nav">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="tentang.html">About</a></li>
                <li><a href="pendaftaran.html">Register</a></li>
            </ul>
        </nav>
    </header>

    <section id="daftar">
        <h2>Pendaftaran Anggota VOCS</h2>
        <form action="#" method="post">
            <fieldset>
                <legend>Data Pendaftar</legend>

                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" name="nama" required />

                <label for="nim">NIM</label>
                <input type="text" id="nim" name="nim" required />

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required />

                <label for="angkatan">Angkatan</label>
                <input type="number" id="angkatan" name="angkatan" min="2015" max="2030" />

                <label for="minat">Divisi yang diminati?</label>
                <select id="minat" name="minat">
                    <option>Soprano</option>
                    <option>Alto</option>
                    <option>Tenor</option>
                    <option>Bass</option>
                </select>

                <label for="alasan">Alasan Bergabung</label>
                <textarea id="alasan" name="alasan" rows="3"></textarea>

                <button type="submit"><a href="enlisted.html">Kirim Pendaftaran</a></button>
            </fieldset>
        </form>
    </section>
</body>
